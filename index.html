<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobius Braid | Space & Topology Archive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen text-slate-100 antialiased relative theme-aether transition-all duration-700">

  <!-- Celestial Space Background Simulator -->
  <div class="space-container">
    <div class="star-layer"></div>
    <div class="star-layer-slow"></div>
    <div class="space-orb orb-left"></div>
    <div class="space-orb orb-right"></div>
    <div class="space-grid"></div>
  </div>

  <!-- Main Container -->
  <div class="relative z-10 flex flex-col min-h-screen">
    
    <!-- Cosmic Selector Dock (Sticky top control panel) -->
    <div class="sticky top-0 z-[80] w-full bg-slate-950/70 border-b border-white/5 backdrop-blur-md px-4 py-2">
      <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
        <div class="flex items-center gap-2">
          <span class="inline-flex w-2.5 h-2.5 rounded-full bg-sky-400 animate-ping"></span>
          <span class="text-[10px] font-black tracking-widest uppercase text-slate-300">Cosmic Wave Interface</span>
        </div>
        <div class="flex items-center gap-1.5 bg-slate-900/80 p-1 rounded-xl border border-white/10" id="cosmicController">
          <button data-theme="aether" class="flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-bold transition-all text-sky-400 bg-white/5 border border-sky-500/20 shadow-xs" aria-label="Aether Orbit">
            <span>🌌</span> Aether Orbit
          </button>
          <button data-theme="solaris" class="flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-orange-400 hover:bg-white/5 border border-transparent" aria-label="Mars Nebula">
            <span>🪐</span> Mars Nebula
          </button>
          <button data-theme="andromeda" class="flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-purple-400 hover:bg-white/5 border border-transparent" aria-label="Andromeda Void">
            <span>💫</span> Andromeda Void
          </button>
        </div>
      </div>
    </div>

    <!-- Clean Minimal Header -->
    <header id="header" class="w-full"></header>

    <!-- Content Sections -->
    <main class="flex-grow">
      <section id="articles" class="w-full"></section>
      <section id="subscribe" class="w-full"></section>
    </main>

    <!-- Modern Soft Footer -->
    <footer class="border-t border-white/5 bg-slate-950/40 backdrop-blur-sm py-10 mt-12">
      <div class="mx-auto max-w-4xl px-5 text-center">
        <p class="text-sm text-slate-400" data-i18n="footer.copyright">
          © 2025 Mobius Braid. All rights reserved.
        </p>
        <p class="mt-2 text-xs text-slate-500" data-i18n="footer.tagline">
          Weaving continuous logical networks across Woven Topology.
        </p>
      </div>
    </footer>
  </div>

  <!-- Single Entry Script -->
  <script type="module" src="main.js"></script>
</body>
</html>
