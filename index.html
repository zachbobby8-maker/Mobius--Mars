<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobius Braid | Mars Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            void: '#0b0504',
            abyss: '#180a08',
            surface: '#26120e',
            edge: '#381b15',
            flux: { 400: '#fb923c', 500: '#f97316', 600: '#ea580c' },
            braid: { 400: '#fca5a5', 500: '#ef4444', 600: '#dc2626' },
            glow: '#ffedd5'
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-void text-slate-100 antialiased">
  <!-- Ambient Martian background -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-fade"></div>
  </div>

  <!-- Navigation -->
  <nav id="navbar" class="fixed top-0 inset-x-0 z-50 transition-all duration-300">
    <div class="mx-auto max-w-5xl px-5 py-4 flex items-center justify-between">
      <a href="#hero" class="text-lg font-bold tracking-tight text-white hover:text-flux-400 transition-colors">
        <span class="text-flux-500">☄</span> Mobius Braid
      </a>
      <div class="hidden sm:flex items-center gap-6 text-sm">
        <a href="#philosophy" class="nav-link" data-i18n="nav.philosophy">Philosophy</a>
        <a href="#articles" class="nav-link" data-i18n="nav.articles">Articles</a>
        <a href="#subscribe" class="nav-link" data-i18n="nav.subscribe">Subscribe</a>
      </div>
      <button id="mobileMenuBtn" class="sm:hidden p-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition-colors" aria-label="Open menu">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
    <div id="mobileMenu" class="hidden sm:hidden bg-abyss/95 backdrop-blur-xl border-t border-white/5">
      <div class="px-5 py-4 flex flex-col gap-3">
        <a href="#philosophy" class="nav-link-mobile" data-i18n="nav.philosophy">Philosophy</a>
        <a href="#articles" class="nav-link-mobile" data-i18n="nav.articles">Articles</a>
        <a href="#subscribe" class="nav-link-mobile" data-i18n="nav.subscribe">Subscribe</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main>
    <section id="hero"></section>
    <section id="philosophy"></section>
    <section id="links"></section>
    <section id="articles"></section>
    <section id="subscribe"></section>
  </main>

  <!-- Footer -->
  <footer class="border-t border-white/5 bg-void/80 backdrop-blur-sm">
    <div class="mx-auto max-w-5xl px-5 py-10 text-center">
      <p class="text-sm text-slate-500">
        <span data-i18n="footer.copyright">© 2025 Mobius Braid. All rights reserved.</span>
      </p>
      <p class="mt-2 text-xs text-slate-600" data-i18n="footer.tagline">
        Weaving the fabric of the 5th Industrial Revolution on Mars.
      </p>
    </div>
  </footer>

  <script type="module" src="main.js"></script>
</body>
</html>
